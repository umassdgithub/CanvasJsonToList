<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas JSON to Emails</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.2rem; margin-bottom: 4px; }
  p { margin: 4px 0 12px; color: #555; font-size: 0.9rem; }
  textarea { width: 100%; box-sizing: border-box; height: 180px; font-family: ui-monospace, monospace; font-size: 0.85rem; padding: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  button { padding: 6px 14px; cursor: pointer; }
  #status { font-size: 0.9rem; color: #555; }
  #status.error { color: #b00020; }
</style>
</head>
<body>
  <h1>Canvas JSON to Emails</h1>
  <p>Paste the JSON returned by <code>/api/v1/courses/&lt;id&gt;/users?enrollment_type[]=student&amp;per_page=100</code></p>

  <textarea id="input" placeholder='[{"id":1,"name":"...","email":"..."}, ...]'></textarea>

  <div class="row">
    <button id="parse">Extract emails</button>
    <label>Separator
      <select id="sep">
        <option value="; ">semicolon</option>
        <option value=", ">comma</option>
        <option value="&#10;">new line</option>
      </select>
    </label>
    <label><input type="checkbox" id="names"> include names</label>
    <button id="copy">Copy</button>
    <span id="status"></span>
  </div>

  <textarea id="output" readonly placeholder="Emails appear here"></textarea>

<script>
  const $ = id => document.getElementById(id);

  function parse() {
    const status = $('status');
    status.className = '';
    // Canvas prefixes JSON responses with "while(1);" -- strip it if present
    const raw = $('input').value.trim().replace(/^while\(1\);/, '');
    if (!raw) { $('output').value = ''; status.textContent = ''; return; }

    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      status.className = 'error';
      status.textContent = 'Not valid JSON: ' + e.message;
      return;
    }
    if (!Array.isArray(data)) data = [data];

    const withNames = $('names').checked;
    const seen = new Set();
    const rows = [];
    let missing = 0;

    for (const u of data) {
      const email = u && (u.email || (u.login_id && u.login_id.includes('@') ? u.login_id : null));
      if (!email) { missing++; continue; }
      const key = email.toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);
      rows.push(withNames ? `${u.name || u.sortable_name || ''} <${email}>` : email);
    }

    rows.sort((a, b) => a.localeCompare(b));
    $('output').value = rows.join($('sep').value);
    status.textContent = rows.length + ' emails' + (missing ? `, ${missing} without an email` : '');
  }

  $('parse').addEventListener('click', parse);
  $('sep').addEventListener('change', parse);
  $('names').addEventListener('change', parse);

  $('copy').addEventListener('click', async () => {
    const out = $('output');
    try {
      await navigator.clipboard.writeText(out.value);
    } catch (e) {
      out.select();
      document.execCommand('copy');
    }
    $('status').className = '';
    $('status').textContent = 'Copied';
  });
</script>
</body>
</html>
